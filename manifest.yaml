# memory-extension protocol manifest — single declarative source for the
# extension's wire protocol (tools). Handlers are bound by name in code.
id: memory
version: 0.1.0
tools:
  - name: todowrite
    description: Replace the session's todo list (stored in the database, not a file).
    input_schema:
      type: object
      properties:
        todos:
          type: array
          items:
            type: object
            properties:
              content: { type: string }
              status: { type: string, enum: [pending, in_progress, completed, cancelled] }
              priority: { type: string, enum: [high, medium, low] }
            required: [content, status, priority]
      required: [todos]
  - name: history_search
    description: Search this session's chat history by keyword (case-insensitive substring over parts(type=text) text, tool names and change ids), optionally constrained to a time range [from, to] (YYYY-MM-DD HH:MM:SS). Returns messages newest-first with their role, depth (0 = newest), tool name and workspace change id.
    input_schema:
      type: object
      properties:
        query: { type: string }
        from: { type: string }
        to: { type: string }
        limit: { type: integer }
      required: [query]
  - name: history_range
    description: Read this session's chat history by position (depth) window. depth 0 = the newest message; positive numbers go back in time; negative numbers count from the newest side (-1 = newest). Returns [depth_from, depth_to) oldest-first with role, content, tool name and change id.
    input_schema:
      type: object
      properties:
        from: { type: integer }
        to: { type: integer }
        limit: { type: integer }
  # ---- file storage (uploaded attachments) ----
  # An attachment is referenced in chat as `file:<code>` (its 8-char, content
  # sha256-based object key). The model resolves it through these tools; it
  # never sees the bytes directly.
  - name: file_info
    description: Return metadata (name, mime type, size, sha256) for a previously uploaded file referenced as file:<code>. Use this first to learn a file's type and size before deciding to read or analyze it.
    input_schema:
      type: object
      properties:
        code: { type: string, description: "The file code (the 8-char segment after file:)" }
      required: [code]
  - name: file_read
    description: Read the text content of an uploaded file referenced as file:<code>. Returns the leading bytes (up to limit lines / offset window). Binary files (e.g. images) are not readable as text — use file_info and be aware of the mime type.
    input_schema:
      type: object
      properties:
        code: { type: string, description: "The file code (the 8-char segment after file:)" }
        offset: { type: integer, description: "Starting line (1-based, default 1)" }
        limit: { type: integer, description: "Max lines to return (default 200)" }
      required: [code]
  - name: file_url
    description: Get a short-lived presigned download URL for a previously uploaded file referenced as file:<code>. Use this to hand a direct URL to a sandbox (e.g. sandbox-run curl -o) or to fetch the raw bytes yourself.
    input_schema:
      type: object
      properties:
        code: { type: string, description: "The file code (the 8-char segment after file:)" }
      required: [code]
